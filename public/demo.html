<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{chat.title}}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f4f5f7; color: #1c1e21; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  #status { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: #e8e8ea; }
  #status.ok { background: #d4edda; }
  #status.bad { background: #f8d7da; }
  a { color: #0a66c2; }
  .card { background: #fff; border: 1px solid #d9dbe0; border-radius: 8px; padding: 12px; margin: 12px 0; }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=password] { padding: 6px 8px; border: 1px solid #c4c7cc; border-radius: 6px; }
  input[type=text]#text { flex: 1; min-width: 200px; }
  button { padding: 6px 12px; border: 1px solid #c4c7cc; background: #f0f1f3; border-radius: 6px; cursor: pointer; }
  button.primary { background: #0a66c2; border-color: #0a66c2; color: #fff; }
  #messages { list-style: none; margin: 6px 0 0; padding: 0; }
  #messages li { padding: 6px 4px; border-bottom: 1px solid #ececf0; }
  .del { color: #999; font-style: italic; }
  .muted { color: #666; font-size: 12px; }
  .err { color: #c0392b; }
  #notice { white-space: pre-wrap; font-size: 13px; min-height: 1em; }
  details { margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{chat.heading}}</h1>
    <span>{{chat.onlinePrefix}} <b id="online">?</b> {{chat.onlineSuffix}}</span>
    <span class="muted">{{chat.ipLabel}}<span id="ip"></span></span>
    <a href="/admin">{{chat.adminLink}}</a>
    <span id="status">{{chat.statusConnecting}}</span>
  </header>

  <div class="card">
    <div class="row">
      <input type="text" id="nick" placeholder="{{chat.nickPlaceholder}}" maxlength="24">
      <input type="text" id="text" placeholder="{{chat.textPlaceholder}}" maxlength="1000">
      <button class="primary" id="send">{{chat.sendBtn}}</button>
    </div>
    <div id="notice" class="muted"></div>
  </div>

  <div class="card">
    <ul id="messages"></ul>
  </div>

  <details class="card">
    <summary>{{chat.helpSummary}}</summary>
    <ul class="muted">
      <li>{{chat.help1}}</li>
      <li>{{chat.help2}}</li>
      <li>{{chat.help3}}</li>
    </ul>
  </details>
</div>

<!--COPY-->
<script>
"use strict";
const COPY = window.COPY, fill = window.fill;
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const cid = store.get("wl.client") || (() => { const id = crypto.randomUUID(); store.set("wl.client", id); return id; })();
$("nick").value = store.get("wl.nick") || "";
$("nick").addEventListener("input", () => store.set("wl.nick", $("nick").value.trim()));

const listEl = $("messages");
const seen = new Map();          // id -> li (dedupe across history/live; ids are strings)
let esClosed = false;            // read by the connect loop
// Dedupe and cursor are separate concerns: rendering always dedupes via the seen Map (both
// numeric history ids and "e<id>" live ids), while `since` is only the reconnect resume bound,
// advanced by bumpSince for numeric ids (skipping "e<id>" live ids).

const NOTE = "placeholder";
// Empty-state placeholder (a single muted li, present only while no real message is rendered).
function setNote(text) {
  let p = listEl.querySelector("." + NOTE);
  if (text == null) { if (p) p.remove(); return; }
  if (!p) {
    const li = document.createElement("li");
    li.className = "muted " + NOTE;
    listEl.append(li);
    p = li;
  }
  p.textContent = text;
}

const timeOf = (t) => { const d = new Date(typeof t === "number" ? t : t); return isNaN(d) ? "" : " " + d.toLocaleTimeString(); };
const notice = (msg, isErr) => { const n = $("notice"); n.textContent = msg; n.className = isErr ? "err" : ""; };
const setStatus = (text, cls) => { const s = $("status"); s.textContent = text; s.className = cls || ""; };

function renderMessage(p) {
  if (seen.has(p.id)) return;
  const li = document.createElement("li");
  li.dataset.at = String(p.created_at); // reused to rebuild the placeholder on a live delete
  const ts = document.createElement("span");
  ts.className = "muted";
  ts.textContent = timeOf(p.created_at);
  if (p.deleted) {
    const d = document.createElement("span");
    d.className = "del";
    d.textContent = COPY.chat.msgDeleted;
    li.append(d, ts);
  } else {
    const who = document.createElement("b");
    who.textContent = fill(COPY.chat.msgAuthor, { nick: p.nick });
    const body = document.createElement("span");
    body.textContent = p.text;
    li.append(who, body, ts);
  }
  seen.set(p.id, li);
  if (listEl.querySelector("." + NOTE)) setNote(null); // first real message clears the placeholder
  listEl.prepend(li);   // single timeline: newest on top
  while (listEl.children.length > 200) listEl.lastChild.remove(); // trim the oldest (bottom)
}

// Live soft delete (delete event, payload {id}): rebuild the node as a deleted placeholder.
function markDeleted(id) {
  const li = seen.get(String(id));
  if (!li) return;
  const at = timeOf(li.dataset.at);
  li.textContent = "";
  const d = document.createElement("span");
  d.className = "del";
  d.textContent = COPY.chat.msgDeleted;
  li.append(d);
  if (at) {
    const ts = document.createElement("span");
    ts.className = "muted";
    ts.textContent = at;
    li.append(ts);
  }
}

async function loadHistory() {
  setNote(COPY.chat.noteLoading);
  try {
    const j = await fetch("/api/messages?limit=50").then((r) => r.json());
    // API returns newest-first; prepending needs oldest-first, so reverse before rendering.
    const msgs = j.messages.slice().reverse();
    for (const m of msgs) renderMessage(m);
    if (j.mode === "ephemeral") setNote(COPY.chat.noteEphemeral);
    else if (!msgs.length) setNote(COPY.chat.noteEmpty);
    else setNote(null);
  } catch { setNote(null); /* network/JSON errors are silent: the SSE side recovers */ }
}

async function send() {
  const text = $("text").value.trim();
  const nick = ($("nick").value.trim() || COPY.chat.defaultNick).slice(0, 24);
  if (!text) return;
  $("text").value = "";
  store.set("wl.nick", nick);
  try {
    const res = await fetch("/api/messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ client_id: cid, nick, text }),
    });
    const j = await res.json().catch(() => null);
    if (!res.ok) {
      $("text").value = text; // restore input on failure
      const code = j && j.error && j.error.code;
      notice((j && j.error && j.error.message) || fill(COPY.chat.sendFailed, { status: res.status }), true);
      // 403 has two causes: muted (banned) vs origin rejected - do not conflate them.
      if (code === "banned") setStatus(COPY.chat.statusBanned, "bad");
      else if (code === "origin_not_allowed" || code === "missing_origin") setStatus(COPY.chat.statusOriginDenied, "bad");
      else if (res.status === 403) setStatus(COPY.chat.statusForbidden, "bad");
      else if (res.status === 429) setStatus(COPY.chat.statusTooFast, "bad");
      return;
    }
    notice("");
  } catch { $("text").value = text; notice(COPY.chat.sendNetworkError, true); }
}

// SSE read loop with auto-reconnect (1s later, resuming from the `since` cursor).
let since = 0; // 0 = from the start; advanced monotonically by bumpSince
async function connect() {
  while (!esClosed) {
    setStatus(COPY.chat.statusConnecting);
    try {
      const res = await fetch("/api/stream?client_id=" + encodeURIComponent(cid) + (since ? "&since=" + since : ""));
      if (!res.ok) {
        let msg = res.status + " " + res.statusText;
        try { const j = await res.json(); msg = (j && j.error && j.error.message) || msg; } catch {}
        setStatus(fill(COPY.chat.statusConnectFailed, { msg }), "bad");
        await sleep(2000);
        continue;
      }
      setStatus(COPY.chat.statusConnected, "ok");
      const reader = res.body.getReader();
      const dec = new TextDecoder(); let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const block = buf.slice(0, i); buf = buf.slice(i + 2);
          handleBlock(block);
        }
      }
    } catch { /* reconnect below */ }
    setStatus(COPY.chat.statusReconnecting, "bad");
    await sleep(1000);
  }
}
function handleBlock(block) {
  let type = "message", data = null;
  for (const line of block.split("\n")) {
    if (line.startsWith("event:")) type = line.slice(6).trim();
    else if (line.startsWith("data:")) { try { data = JSON.parse(line.slice(5).trim()); } catch { data = null; } }
  }
  if (data === null) return; // ": ping" and other comment-only blocks carry no data
  if (type === "message" && data && data.id !== undefined) {
    renderMessage(data);
    bumpSince(data.id);
  } else if (type === "delete" && data && data.id !== undefined) {
    markDeleted(data.id);
    bumpSince(data.id);
  } else if (type === "presence" && data) {
    $("online").textContent = String(data.online);
  } else if (type === "ban") {
    setStatus(COPY.chat.statusBanned, "bad");
    notice(fill(COPY.chat.banNotice, { reason: (data && data.reason) || COPY.chat.banReasonUnknown }));
  } else if (type === "notice" && data && data.kind === "history_mode") {
    notice(data.mode === "ephemeral"
      ? COPY.chat.historyOff
      : fill(COPY.chat.historyKept, { n: String(data.retention_days) }));
  } else if (type === "error") {
    notice(fill(COPY.chat.errorNotice, { msg: (data && data.message) || JSON.stringify(data) }), true);
  }
}

// Only numeric ids advance the resume bound ("e<eventId>" live ids are skipped): `since` is a
// conservative lower bound, so replays are absorbed by the seen Map instead of dropping events.
function bumpSince(id) {
  const n = Number(id);
  if (Number.isInteger(n) && n > since) since = n;
}

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

$("send").onclick = send;
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
$("nick").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("text").focus(); } });

(async () => {
  try {
    const meta = await fetch("/api/meta").then((r) => r.json());
    $("ip").textContent = meta.client_ip || COPY.chat.ipUnknown;
    if (meta.limits) {
      $("nick").maxLength = meta.limits.nick_max || 24;
      $("text").maxLength = meta.limits.text_max || 1000;
    }
  } catch {}
  await loadHistory();
  connect();
})();
</script>
</body>
</html>
